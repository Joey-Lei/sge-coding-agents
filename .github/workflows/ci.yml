name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run public API tests
        run: python -m pytest -q tests
      - name: Run CLI smoke
        run: sge analyze examples/minimal_workgraph.json --workers 1,2,4

  artifact:
    name: Frozen offline artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact artifact environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[artifact,dev]"
      - name: Recompute evidence and figures
        run: python reproduce.py
      - name: Run all tests
        run: python -m pytest -q
      - name: Audit public release
        run: python tools/check_release.py
      - name: Confirm deterministic tracked outputs
        run: git diff --exit-code
